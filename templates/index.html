<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.name }} - Bazar Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: {{ config.theme.primary_gradient }};
            min-height: 100vh;
            color: #333;
            padding-bottom: 50px;
        }

        .header {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-weight: 800;
        }
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .vendors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .vendor-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            transition: all 0.3s ease;
            text-decoration: none;
            color: #2d3436;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .vendor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.25);
            background: rgba(255, 255, 255, 0.95);
        }

        .vendor-icon {
            width: 60px;
            height: 60px;
            background: {{ config.theme.accent_gradient }};
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .vendor-name {
            font-size: 1.5em;
            font-weight: 800;
            margin-bottom: 8px;
            background: -webkit-linear-gradient(45deg, #2d3436, #000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .vendor-desc {
            font-size: 0.95em;
            color: #636e72;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .visit-btn {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            background: rgba(0,0,0,0.05);
            border-radius: 12px;
            font-weight: 700;
            color: #2d3436;
            transition: all 0.3s;
        }
        .vendor-card:hover .visit-btn {
            background: {{ config.theme.accent_gradient }};
            color: white;
        }

        /* Responsive Fixes */
        @media (max-width: 480px) {
            .header h1 { font-size: 2.2em; }
            .vendors-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>{{ config.name }}</h1>
        <p>Explora nuestros {{ vendors|length }} negocios exclusivos y haz tu pedido directamente al stand.</p>
    </div>

    <div class="container">
        <div class="vendors-grid">
            {% for vendor in vendors %}
            <a href="/{{ vendor.id }}" class="vendor-card">
                <div>
                    <div class="vendor-icon">
                        <i class="fas fa-store"></i>
                    </div>
                    <div class="vendor-name">{{ vendor.name }}</div>
                    <div class="vendor-desc">{{ vendor.description }}</div>
                </div>
                <div class="visit-btn">
                    Ver Menú <i class="fas fa-arrow-right" style="margin-left: 5px;"></i>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>

</body>
</html>
